name: Build All Phones
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter create . --platforms=android,web,ios --project-name callguard_pro
      - run: flutter pub get
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - run: flutter build web --release --base-href /callguard/
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-for-playstore
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-for-testing
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web-pwa-for-all-phones
          path: build/web
